# Commands this package provides: `astro <name> [args]` runs `run` (astro help lists them).
# level: core (astro help) or setup (astro help --all); host: the role astro forwards it to off-robot;
# choices_from: a command printing one choice per line (a TAB and a description may follow).
# Voice: summary and notes in everyday words ("the boat computer", "the camera computer", "the operator
# laptop"); topics, config keys, nodes and paths go in details.
package: mhseals_nav
summary: The boat's sense of where it is and where to go - position, cameras and lidar, navigation, tasks and RTK GPS.
commands:
  - name: device
    run: ros2 launch mhseals_nav device.launch.py
    level: setup
    host: boat_computer
    summary: Start one computer's share of the boat software by hand; astro up normally does this for you.
    notes: Useful to start or restart a single part while debugging, e.g. only localization on the boat computer.
    details: >-
      Each part is one domain launch file (localization, perception, navigation, mission; sim_bridge in the sim)
      with the arguments that pick this computer's hardware, from config/devices/<device>.yaml (extends: inherits
      another profile, e.g. sim extends odroid and jetson). Layers: $ROS_WS/config/devices/<device>.yaml, then
      ~/.config/mhseals/devices/, then overrides. The drive stack is mhseals_hardware's drive.
    params:
      - {name: device, required: true, choices_from: ros2 run mhseals_nav device_parts --devices, list: true,
         description: 'Which computer this is, by its profile, e.g. odroid for the boat computer.'}
      - {name: only, choices_from: ros2 run mhseals_nav device_parts, list: true,
         description: 'Only these parts, comma-separated, e.g. localization; leave empty to start all of them.'}
      - {name: overrides, description: 'Settings for this run only, as JSON in the device file layout.'}
    examples:
      - ros2 launch mhseals_nav device.launch.py device:=odroid only:=localization
      - ros2 launch mhseals_nav device.launch.py device:=sim

  - name: rtk base
    run: ros2 run mhseals_nav rtk base
    level: core
    host: operator
    needs: [localization]          # MAVROS on the boat is what takes the corrections; without it nothing listens
    summary: Make the boat's GPS accurate to a few centimetres by sending it corrections from a base receiver or an internet service. Leave it running.
    notes: Check it works with astro rtk status (it should say fixed). Ctrl-C stops the corrections.
    details: >-
      RTK corrections to MAVROS from the USB base receiver and/or NTRIP. Settings: ~/.config/mhseals/rtk.yaml
      (device, saved sites, ntrip overrides); casters in config/ntrip.yaml, credentials in
      ~/.config/astro/secrets.env. The NTRIP mountpoint is the nearest to the rough fix (any region).
    params:
      - {name: port, default: auto, choices_from: astro rtk ports,
         description: 'Where the base GPS receiver is plugged in, e.g. /dev/ttyACM0; auto finds it.'}
      - {name: --source, choices: [auto, local, ntrip], default: auto, description: 'Where corrections come from: local is your own base receiver, ntrip an internet service, auto uses whichever is better.'}
      - {name: --pin, default: auto, description: 'Use only this internet correction station, e.g. RTK2go/MYMOUNT; auto picks the nearest one.', free: mountpoints come from the caster table}
      - {name: --survey, type: bool, description: 'Have the base receiver measure its own position again (takes minutes).'}
      - {name: --known, description: 'Put the base at a spot you saved before, by its name, e.g. lake.', free: saved sites live in the host's rtk.yaml}
      - {name: --resume, type: bool, description: 'Keep the base receiver''s current position, without measuring again.'}
    examples:
      - ros2 run mhseals_nav rtk base --source ntrip
      - ros2 run mhseals_nav rtk base /dev/ttyACM0 --source local --survey

  - name: rtk status
    run: ros2 run mhseals_nav rtk status
    level: core
    host: operator
    summary: Check how accurate the boat's GPS is right now (none, float or fixed) and whether corrections are arriving.
    notes: Fixed is the best, a few centimetres. If no corrections arrive, start astro rtk base.
    details: Shows the rover fix, satellites, and the corrections' source, mount and age; exits 1 unless corrections reach a subscriber.
    params:
      - {name: --watch, type: bool, description: 'Print a new status line every 2 s until Ctrl-C.'}
    examples:
      - ros2 run mhseals_nav rtk status --watch

  - name: rtk ports
    run: ros2 run mhseals_nav rtk ports
    level: setup
    host: operator
    summary: List the GPS base receivers plugged into this laptop, best first; rtk base uses the first.

  - name: task
    run: ros2 run mhseals_nav run_task
    level: core
    host: boat_computer
    needs: [localization, drive+controller, nav]
    summary: Run one autonomous task (say, the navigation channel) or the whole mission, and see whether it succeeded.
    notes: Taking over with the remote ends it. It starts the software it needs first.
    details: >-
      Runs one task tree (mhseals_nav/tasks/trees) with its config/tasks/ YAML. Exits 0 success, 1 failure,
      2 timeout, 3 human override (the mux input rc, manual or hold), 4 refused (a human had control). Events on
      /task/events, status on /task/status.
    params:
      - {name: --task, required: true, choices_from: ros2 run mhseals_nav run_task --list, description: 'The task to run, e.g. nav_channel, or mission for the whole run.'}
      - {name: --params, type: path, default: auto, description: 'A settings file for the task, e.g. config/tasks/mission_crane.yaml; auto is the task''s own.'}
      - {name: --profile, choices: [qualifying, finals], default: auto, description: "Which competition round's settings to use: qualifying or finals; auto keeps the mission's own."}
    examples:
      - ros2 run mhseals_nav run_task --task nav_channel
      - ros2 run mhseals_nav run_task --task mission --params config/tasks/mission_crane.yaml --ros-args -p use_sim_time:=true

  - name: trial
    run: ros2 run mhseals_nav trial
    level: core
    host: boat_computer
    needs: [localization, drive+controller, nav]
    summary: Have the boat drive a set shape (a square, a zigzag, a figure eight in the pool) on its own and score how well it followed it, to compare navigation settings.
    notes: >-
      The course starts where the boat is now, so leave room. It prints the score and adds it to today's log.
      Pool courses stop the boat if it leaves a 9 x 4 m box around the course. home drives back to where
      today's last trial started. In the pool, start the navigation with astro up nav --with pool.
    details: >-
      Courses are config/trials/<course>.yaml, driven through Nav2; pool-* courses' points are fractions of
      their length: key (set it to the pool's straightaway, or use --scale). Metrics: time, mean/max cross-track error, final position
      error, yaw-rate sign changes, max speed, and a hash of controller_server's parameters. One line goes to
      $ASTRO_DATA/<date>/log.txt and /events; the start pose to $ASTRO_DATA/<date>/trial_start.yaml (home's
      goal). The course is published on /trial/course (MarkerArray) for astro rviz nav. Leaving the box
      cancels the Nav2 goal (Nav2 then commands zero), no lock.
    params:
      - {name: course, required: true, choices_from: ros2 run mhseals_nav trial --list, description: 'The shape to drive, e.g. pool-square, or home to drive back to the start of the last one.'}
      - {name: --scale, type: float, default: 1.0, choices: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0], description: 'Shrink or grow the course to fit the water, e.g. 0.5 for a small area.'}
      - {name: --odom, default: /odom/global, choices: [/odom/global, /odom/local], description: 'Which position to score against: global uses GPS, local drifts slowly but is smoother.'}
      - {name: --tolerance, type: float, default: 0.5, choices: [0.25, 0.5, 1.0, 2.0], description: 'How close, in metres, counts as reaching each corner, e.g. 1.0.'}
      - {name: --box, default: auto, choices: [auto, 6x3, 9x4, 12x6, none], description: "Stop the trial if the boat leaves a box this size around the course, length along the start heading by width in metres; auto is the course's own (pool courses 9x4, others none), none never stops it."}
      - {name: --cmd, default: /cmd_vel, description: "The navigation command to compare with how the boat really moved, e.g. /cmd_vel.", free: a ROS topic name}
    examples:
      - ros2 run mhseals_nav trial square --scale 0.5
      - ros2 run mhseals_nav trial pool-square --box 6x6
      - ros2 run mhseals_nav trial home

  - name: rviz
    run: ros2 run mhseals_nav rviz
    level: core
    summary: Open the 3-D view on this computer - the boat, its plan and the costmaps - and click a spot to send the boat there.
    notes: >-
      Runs where you are (the operator laptop), never on the boat. In nav, pick 2D Goal Pose (G) and click,
      then drag for the heading; the Navigation 2 panel cancels the goal.
    details: >-
      rviz2 -d rviz2/<config>.rviz with the workspace theme ($ROS_WS/config/dark.qss). nav shows the robot
      model, footprint, odometry trail, /points, both costmaps, /plan, /local_plan, MPPI's /trajectories and
      /optimal_trajectory (a preset with visualize on), /goal_pose and the trial course (/trial/course), top-down
      10 m around base_link; the 2D Goal Pose tool publishes /goal_pose.
    params:
      - {name: config, default: nav, choices_from: ros2 run mhseals_nav rviz --list, description: 'Which view: nav (navigation, goals) or perception (cameras, lidar, objects).'}
    examples:
      - ros2 run mhseals_nav rviz nav
