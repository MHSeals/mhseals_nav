# Commands this package provides: `astro <name> [args]` runs `run` (astro help lists them).
# level: core (astro help) or setup (astro help --all); host: the role astro forwards it to off-robot;
# choices_from: a command printing one choice per line (a TAB and a description may follow).
package: mhseals_nav
summary: Boat bringup - localization, perception, Nav2, tasks and RTK.
commands:
  - name: device
    run: ros2 launch mhseals_nav device.launch.py
    level: setup
    host: boat_computer
    summary: Start a computer's parts of the stack (config/devices/<device>.yaml); astro up starts them as stacks.
    notes: >-
      Parts: odroid localization (MAVROS, TF and the EKFs), mapping, navigation, mission; jetson camera,
      objects, lidar, host_diagnostic; operator rtk; sim adds sim_bridge (the Unity endpoint) to the odroid
      and jetson parts. The drive stack is mhseals_hardware's drive. Layers: $ROS_WS/config/devices/<device>.yaml,
      then ~/.config/mhseals/devices/, then overrides.
    params:
      - {name: device, required: true, choices: [odroid, jetson, operator, sim], description: Device profile in config/devices/.}
      - {name: only, choices_from: ros2 run mhseals_nav device_parts,
         description: 'Comma-separated parts to start; empty starts all. ros2 run mhseals_nav device_parts DEVICE lists them.'}
      - {name: overrides, description: 'Session layer: JSON in the device profile schema.'}
    examples:
      - ros2 launch mhseals_nav device.launch.py device:=odroid only:=localization
      - ros2 launch mhseals_nav device.launch.py device:=sim

  - name: rtk base
    run: ros2 run mhseals_nav rtk base
    level: core
    host: operator
    summary: RTK corrections to MAVROS from the USB base receiver and/or NTRIP, until Ctrl-C.
    notes: >-
      Settings: ~/.config/mhseals/rtk.yaml (device, saved sites, ntrip overrides); casters in config/ntrip.yaml,
      credentials in ~/.config/astro/secrets.env. The NTRIP mountpoint is the nearest to the rough fix (any region).
    params:
      - {name: port, default: auto, choices_from: ros2 run mhseals_nav rtk ports,
         description: 'Serial device of the base receiver; auto is the settings device, else the first u-blox found (rtk ports).'}
      - {name: --source, choices: [auto, local, ntrip], default: auto, description: 'auto uses both (the nearer/fixed one feeds the FCU); local the USB base only; ntrip NTRIP only.'}
      - {name: --pin, default: auto, description: 'Stream only this NTRIP mountpoint (MOUNT or CASTER/MOUNT); auto is the nearest.'}
      - {name: --survey, type: bool, description: Start a new survey-in.}
      - {name: --known, description: Fix the base at a named saved site.}
      - {name: --resume, type: bool, description: Adopt the receiver as it is.}
    examples:
      - ros2 run mhseals_nav rtk base --source ntrip
      - ros2 run mhseals_nav rtk base /dev/ttyACM0 --source local --survey

  - name: rtk status
    run: ros2 run mhseals_nav rtk status
    level: core
    host: operator
    summary: The rover fix (none/float/fixed), satellites, and the corrections' source, mount and age.
    notes: Exits 1 unless corrections reach a subscriber.
    params:
      - {name: --watch, type: bool, description: Print a line every 2 s until Ctrl-C.}
    examples:
      - ros2 run mhseals_nav rtk status --watch

  - name: rtk ports
    run: ros2 run mhseals_nav rtk ports
    level: setup
    host: operator
    summary: The base receivers found (serial device and how), best first; rtk base uses the first.

  - name: task
    run: ros2 run mhseals_nav run_task
    level: core
    host: boat_computer
    summary: Run one task tree (mhseals_nav/tasks/trees) with its config/tasks/ YAML.
    notes: >-
      Exits 0 success, 1 failure, 2 timeout, 3 human override (the mux input rc, manual or hold), 4 refused
      (a human had control). Events on /task/events, status on /task/status.
    params:
      - {name: --task, required: true, choices_from: ros2 run mhseals_nav run_task --list, description: Task tree name.}
      - {name: --params, type: path, default: auto, description: 'Task YAML; auto is config/tasks/<task>.yaml.'}
      - {name: --profile, choices: [qualifying, finals], default: auto, description: "Mission overlay config/tasks/profiles/<name>.yaml; auto is the mission YAML's."}
    examples:
      - ros2 run mhseals_nav run_task --task nav_channel
      - ros2 run mhseals_nav run_task --task mission --params config/tasks/mission_crane.yaml --ros-args -p use_sim_time:=true

  - name: trial
    run: ros2 run mhseals_nav trial
    level: core
    host: boat_computer
    summary: Drive a course from config/trials/ (relative to the start pose) through Nav2, then print, log and publish its metrics.
    notes: >-
      Metrics: time, mean/max cross-track error, final position error, yaw-rate sign changes, max speed, and a
      hash of controller_server's parameters. One line goes to $ASTRO_DATA/<date>/log.txt and /events.
    params:
      - {name: course, required: true, choices_from: ros2 run mhseals_nav trial --list, description: 'config/trials/<course>.yaml.'}
      - {name: --scale, type: float, default: 1.0, description: Multiply the course size (0.5 for a small area).}
      - {name: --odom, default: /odom/global, description: Odometry topic; the goals use its frame.}
      - {name: --tolerance, type: float, default: 0.5, description: 'm from a leg pose that counts as reached; done only when every leg is.'}
      - {name: --cmd, default: /cmd_vel, description: "Nav2's smoothed command, compared with odometry for track=."}
    examples:
      - ros2 run mhseals_nav trial square --scale 0.5
