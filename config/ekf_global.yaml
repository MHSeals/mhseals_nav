/**:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true
    transform_time_offset: 0.0

    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # === Body Velocity ===
    # The same raw source as ekf_local, not its output: /odom/local is already filtered
    # from this IMU and GPS, so re-fusing it double-counts them and adds a filter's lag.
    odom0: /odom/mavros
    odom0_config: [
      false, false, false,   # position comes only from GPS; avoid double-counting
      false, false, false,   # roll, pitch, yaw: from the IMU below
      true,  true,  false,   # vx, vy, vz
      false, false, false,   # vroll, vpitch, vyaw: unmeasured here, from the IMU below
      false, false, false    # ax, ay, az
    ]
    odom0_differential: false

    # === Heading ===
    imu0: /imu/raw
    imu0_config: [
      false, false, false,   # position
      false, false,  true,   # roll, pitch, yaw: absolute heading
      false, false, false,   # vx, vy, vz
      false, false,  true,   # vyaw
      false, false, false    # acceleration
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    
    # ZED magnetometer heading (silent until the ZED magcal; see ekf_local.yaml imu2).
    imu1: /imu/zed_heading
    imu1_queue_size: 5
    imu1_differential: false
    imu1_relative: false
    imu1_remove_gravitational_acceleration: false
    imu1_config: [
      false, false, false,
      false, false, true,    # yaw
      false, false, false,
      false, false, false,
      false, false, false
    ]

    odom1: /odom/gps
    # navsat_transform supplies position, not yaw, velocity or yaw rate.
    odom1_config: [
      true,  true,  false,   # x, y, z
      false, false, false,   # roll, pitch, yaw
      false, false, false,   # vx, vy, vz
      false, false, false,   # vroll, vpitch, vyaw
      false, false, false    # ax, ay, az
    ]
    odom1_differential: false

    # === RTAB-MAP Camera + LiDAR Loop Closure ===
    # odom2: /odom/rtabmap
    # odom2_differential: false
    # odom2_relative: false
    # odom2_queue_size: 10
    # odom2_config: [
    #   true,  true,  false,   # x, y, z
    #   false, false,  true,   # roll, pitch, yaw
    #   false, false, false,   # vx, vy, vz
    #   false, false,  true,   # vroll, vpitch, vyaw
    #   false, false, false    # ax, ay, az
    # ]
