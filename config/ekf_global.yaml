ekf_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true

    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # MAVROS global odom
    odom0: /mavros/local_position/odom
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_config: [
      true,  true,  false,
      false, false, true,
      true,  true,  false,
      false, false, true,
      false, false, false
    ]

    # GPS
    odom1: /gps/odom
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
    odom1_config: [
      true,  true,  false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]