# Most the measured limits (the hardware state file's characterization.nav2_limits) may set, by
# magnitude (the *_min entries bound reverse limits). The launch clips a larger value to it and warns.
# About 2x the field limits in nav2_params.yaml. Kept out of that file because Nav2 servers
# reject any top-level key that is not a node section. Every value is ASSUMED (configured):
# none is a MEASURED safe speed, acceleration or stop. Not raised for the speed profile
# (tasks/speed.py, 10-27): no boat data above 0.4 m/s yet. NEEDS real braking and latency
# measurement before any raise.
vx_max: 0.8
vy_max: 0.3
wz_max: 0.6
ax_max: 0.6
az_max: 1.0
ay_max: 0.6
vx_min: 0.2
ax_min: 0.6
ay_min: 0.6
