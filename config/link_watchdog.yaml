# link_watchdog (B): a lost operator link must not leave autonomy driving (FS_GCS_ENABLE=0).
# The operator station publishes its host name on heartbeat_topic at ~2 Hz. While
# autonomy commands flow and the newest heartbeat is older than max_age_s, it requests a
# command_mux hold. The operator clears it with U; it releases its own hold once the link has
# been back for release_after with the FCU disarmed (armed, it stays until U).
# Only beats naming one of operator_hosts count, never one naming B itself (a TUI on B over
# SSH or tmux is not the operator). Enforced once a heartbeat has arrived this session;
# require_operator also holds before the first one, since on the water an operator who never
# reached B looks the same as one who never existed. Sim and bench launches must set it false
# (config/devices/sim.yaml does, through watchdogs.launch.py).
/**:
  ros__parameters:
    heartbeat_topic: /operator/heartbeat
    operator_hosts: [station]          # host names; station = the one named in station_file
    station_file: ~/.config/mhseals/station.yaml  # hw.sh station take; absent: any host counts
    command_topic: /cmd_vel            # Nav2 -> command_mux auto input
    request_topic: /command_mux/request
    cause: operator_link
    max_age_s: 3.0                     # receipt age of the newest heartbeat (~2 Hz)
    require_operator: true
    command_window_s: 0.5              # autonomy = an auto command within this window
    mux_state_topic: /command_mux/state # its input says what auto reaches
    mux_state_max_age_s: 2.5           # the mux republishes >= 1 Hz; older counts every command
    repeat_s: 1.0
    release_after: 3.0                 # s clear, FCU disarmed: release its own hold
    fcu_state_topic: /mavros/state
    fcu_state_max_age: 3.0             # s; older armed state counts as armed
    rate_hz: 10.0
