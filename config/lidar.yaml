# Canonical startup defaults. Deployment and explicit selection layer over these.
lidar:
  model: VLP16
  frame: lidar_link
  rpm: 600.0
  calibration:
    package: velodyne_pointcloud
    path: params/VLP16db.yaml
  endpoint:   # ip: LIDAR_IP from $ROS_WS/config/boat-network.env (a layer or velodyne_ip may set it)
    port: 2368
