# The lidar, a Velodyne VLP16. Vessel facts are the vessel profile's (hw.sh profile; the profile
# whose directory holds $ASTRO_NETWORK_ENV): the address, the model and the rpm the sensor is set
# to, and the mount when the profile gives one (lidar: mount: {xyz, rpy}, over the description's
# lidar_* properties; without it description/<robot>/<robot>.xacro's mount stands). driver: is
# the rest of the driver pair (sensors.launch.py); lidar_deployment_file and lidar_params_file
# lay driver: overrides over it, then velodyne_ip and velodyne_port.
tune:
  # Sim only (sensors.launch.py sim:=true): smear crane_ml's instantaneous /points over a VLP16
  # sweep with the ground-truth motion (lidar_smear.py), so scans of a turning boat misalign as
  # on the water and lidar_relay's deskew can be judged.
  smear: false

# /perception/nearby (nearby.py, beside the lidar): /points summarized for the TUI as JSON, the
# nearest range per sector from the bow clockwise, the hull plus hull_margin left out.
costmap:
  cloud_topic: /points
  topic: /perception/nearby
  base_frame: base_link         # the summary's frame (the cloud moves there by its /tf_static mount)
  sectors: 16
  rate: 5.0                     # at most; nothing without a new cloud
  min_height: -0.10             # base_link z band, as the perception costmap's lidar marks
  max_height: 3.0
  hull_margin: 0.1              # around config/hull.yaml: the hull's own returns, side spray

driver:
  frame: lidar_link
  calibration:
    package: velodyne_pointcloud
    path: params/VLP16db.yaml
  endpoint:
    port: 2368
