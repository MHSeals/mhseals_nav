/**:
  ros__parameters:
    # /imu/raw runs at 100 Hz with SCHED_LOOP_RATE 200 (config/fcu/odom-100hz.proposed.param).
    # Cost, both EKFs and navsat with 100 Hz FCU and (since dropped) 100 Hz ZED IMU: 9% of one
    # host E-core, within a 2-core budget squeezed to 0.12 E-cores with no gaps over 11 ms (odom-100hz bench).
    # The 2026-10 ODROID gaps of up to 342 ms at 30 Hz were contention, not this cost.
    frequency: 100.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    transform_time_offset: 0.0
    predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # FCU body velocity only: keep GPS position jumps out of odom->base_link.
    odom0: /odom/mavros
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_config: [
      false, false, false,   # x, y, z
      false, false, false,   # roll, pitch, yaw (from IMU below)
      true,  true,  false,   # vx, vy, vz
      false, false, false,   # vroll, vpitch, vyaw (from IMU below)
      false, false, false    # ax, ay, az
    ]

    # === MAVROS IMU ===
    # /imu/raw is the legacy remap of MAVROS /imu/data: FCU-fused ENU
    # orientation, NOT MAVROS /imu/data_raw. Yaw RATE only here: odom must stay
    # continuous, and the FCU heading resets. In the 2026-11-24 pool bags (003544,
    # 004437) it jumped 95-170 deg against the gyro 9 times in 9 min while the field
    # magnitude swung 2-3x with the thrusters. Absolute heading lives in ekf_global (map).
    imu0: /imu/raw
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    
    imu0_config: [
      false, false, false,   # position
      false, false, false,   # roll, pitch, yaw: not fused (gyro-integrated in odom)
      false, false, false,   # vx, vy, vz (IMU does not measure velocity)
      false, false, true,    # angular velocity: yaw rate
      false, false, false    # acceleration off until bias/noise is calibrated
    ]

    # # === ZED Odom VIO ===
    # odom1: /front_camera/odom
    # odom1_differential: false
    # odom1_relative: false
    # odom1_queue_size: 10
    # odom1_config: [
    #   true,  true,  false,   # x, y, z
    #   false, false,  true,   # roll, pitch, yaw
    #   true,  true,  false,   # vx, vy, vz
    #   false, false,  true,   # vroll, vpitch, vyaw
    #   false, false, false    # ax, ay, az
    # ]
