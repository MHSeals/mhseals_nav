/**:
  ros__parameters:
    # /imu/raw runs at 100 Hz with SCHED_LOOP_RATE 200 (config/fcu/odom-100hz.proposed.param).
    # Cost, both EKFs and navsat with 100 Hz FCU + 100 Hz ZED IMU: 9% of one host E-core, within
    # a 2-core budget squeezed to 0.12 E-cores with no gaps over 11 ms (odom-100hz bench).
    # The 2026-10 ODROID gaps of up to 342 ms at 30 Hz were contention, not this cost.
    frequency: 100.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    transform_time_offset: 0.0
    predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # FCU body velocity only: keep GPS position jumps out of odom->base_link.
    odom0: /odom/mavros
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_config: [
      false, false, false,   # x, y, z
      false, false, false,   # roll, pitch, yaw (from IMU below)
      true,  true,  false,   # vx, vy, vz
      false, false, false,   # vroll, vpitch, vyaw (from IMU below)
      false, false, false    # ax, ay, az
    ]

    # === MAVROS IMU ===
    # /imu/raw is the legacy remap of MAVROS /imu/data: FCU-fused ENU
    # orientation, NOT MAVROS /imu/data_raw. Preserve its absolute heading.
    imu0: /imu/raw
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    
    imu0_config: [
      false, false, false,   # position
      false, false, true,    # roll, pitch, yaw
      false, false, false,   # vx, vy, vz (IMU does not measure velocity)
      false, false, true,    # angular velocity: yaw rate
      false, false, false    # acceleration off until bias/noise is calibrated
    ]

    # === ZED 2i IMU (second reference, zed_imu_reference.py on the Orin) ===
    # Gyro yaw rate only: the ZED's own orientation yaw is relative (no magnetometer in it).
    # Its variance is floored at 0.005 rad/s, so the FCU leads while it streams. Lag from the
    # Orin is a few ms; robot_localization applies a late sample as current (no smoothing).
    imu1: /imu/zed
    imu1_queue_size: 20
    imu1_differential: false
    imu1_relative: false
    imu1_remove_gravitational_acceleration: true
    imu1_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,    # yaw rate
      false, false, false
    ]

    # ZED magnetometer heading, absolute yaw. Published only after the ZED magcal
    # (zed_imu_reference.yaml heading_enabled); until then this input stays silent.
    imu2: /imu/zed_heading
    imu2_queue_size: 5
    imu2_differential: false
    imu2_relative: false
    imu2_remove_gravitational_acceleration: false
    imu2_config: [
      false, false, false,
      false, false, true,    # yaw
      false, false, false,
      false, false, false,
      false, false, false
    ]

    # # === DLIO ===
    # odom0: /odom/dlio
    # odom0_differential: false
    # odom0_relative: false
    # odom0_queue_size: 10
    # odom0_config: [
    #   true,  true,  false,   # x, y, z
    #   false, false,  true,   # roll, pitch, yaw
    #   true,  true,  false,   # vx, vy, vz
    #   false, false,  true,   # vroll, vpitch, vyaw
    #   false, false, false    # ax, ay, az
    # ]

