# The whole run, in order; each task's own YAML is loaded under its name and can be
# overridden here (e.g. docking: {banner: red_circle}).
tasks: [nav_channel, follow_path, docking, speed_challenge, return_home]
# The run budget (tasks/params.py timeslot), every mission's unless it sets its own: the
# competition slot less what set-up, launch and recovery take (owner-adjustable); it
# becomes the run's `timeout`, which the run records as its time limit.
timeslot: {slot_s: 900.0, setup_reserve_s: 180.0}
# The course area for searches, map frame, from the day's layout; null searches around home.
search: {area: null}
# Go/no-go gates (tasks/conditions.py; tuning plant study). They only stop or skip; a
# topic set to '' disables its gate, and a topic nobody publishes never blocks.
conditions:
  fix_topic: /mavros/gpsstatus/gps1/raw              # GPS_RAW_INT fix_type
  precise_min_fix: 6        # RTK fixed for precise tasks (docking)
  float_policy: perception  # at RTK float (5): perception (dock anyway) | skip
  drift_topic: /calibrated_velocity_controller/drift
  drift_max: 0.35           # m/s drift estimate held drift_s s: skip precise tasks
  drift_s: 10.0
  command_topic: /cmd_vel/applied
  odom_topic: /odom/local
  effort_topic: /cmd_vel_effort
  track_err_max: [0.15, 0.15]   # m/s, rad/s off the command while the effort saturates
  track_err_s: 5.0              # s held: abort the task, skip precise ones
  sat_effort: 0.95
