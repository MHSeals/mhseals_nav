# Task 3, docking. The banner of the day is announced at the competition.
banner: blue_square
banners: [red_circle, red_triangle, red_square, red_plus,
          green_circle, green_triangle, green_square, green_plus,
          blue_circle, blue_triangle, blue_square, blue_plus]
vessels: [yellow_target_boat, black_target_boat]
# Fixed course markers the run remembers landmark_memory (900 s, tasks/host.py) after
# their last report, where other tracks go after `memory` (5 s): the tracker drops a
# banner seen from beyond ~9 m 10 s after it leaves the view (no class group, it never
# turns STATIC), and a mission finds the dock long before it docks.
landmarks: [red_circle, red_triangle, red_square, red_plus,
            green_circle, green_triangle, green_square, green_plus,
            blue_circle, blue_triangle, blue_square, blue_plus]
berth: 1.2              # m from the banner to the boat's centre: bow 0.67 m off the spine, stern in the bay
staging: 3.0            # m out from the banner, lined up before sliding in
bay_depth: 1.5          # m the bay reaches out from the spine
confirm_tries: 3        # staging poses lined up on, choosing again at each, before docking fails
dock_time: 5.0          # s held in the bay
berth_accept: 0.5       # m from the berth that counts as in the bay if Nav2 gives up
# Holding: drift this far off the berth before driving back; the drive back ends on the
# precise checker (0.3 m, nav2_params.yaml), leaving at least 0.3 m of hysteresis.
hold_redrive: 0.6       # m
hold_precise: true
# Leaving: straight back to the staging pose (Nav2 BackUp), no turn inside the bay.
back_out_speed: 0.1     # m/s, the velocity smoother's reverse limit (min_velocity)
back_out_time: 40.0     # s allowed for one back out (1.8 m at 0.1 m/s takes ~20 s)
back_out_resends: 2     # sends of a BackUp that ends at once (a collision ahead) before the retry
back_out_retries: 3     # retries of the back out before driving out (sim: a retry 2-3 s on clears)
back_out_pause: 2.0     # s held still before each retry, for the costmap to settle
attempts: 2             # tries within the mission's time limit
precise: true           # gated on GPS fix tier, drift and thrusters (mission `conditions`)
search_distance: 20.0
time_limit: 360.0       # includes driving to the task area
timeout: 240.0
