# Task 3, docking. The banner of the day is announced at the competition.
banner: blue_square
banners: [red_circle, red_triangle, red_square, red_plus,
          green_circle, green_triangle, green_square, green_plus,
          blue_circle, blue_triangle, blue_square, blue_plus]
