# Task 4, speed challenge (no light panel yet: the run starts at once).
red: red_buoy
green: green_buoy
mark: blue_buoy
count: black_buoy       # oil spills, counted only past the gate
report: display
max_gate_width: 4.0
search_distance: 30.0   # m; the mark is 40-100 ft past the gate
first_gate_radius: 30.0 # m; the task's first gate is the nearest within this, any way
