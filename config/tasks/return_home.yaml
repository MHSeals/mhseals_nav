# Task 6, return to home through the gate of two black buoys near the start.
marker: black_buoy
home_approach: 6.0           # m out from home, on the boat's side, before looking for the gate
home_radius: 8.0        # m; only black pairs this close to home are the home gate
max_gate_width: 4.0
search_distance: 6.0
first_gate_radius: 30.0 # m; the task's first gate is the nearest within this, any way
corner_side: 1.0        # m the next gate lies to the side before the route gets a mid-point
gate_margin: 0.57       # m the exit lies past each gate beyond half the hull (hull.yaml)
gate_retry_past: 0.5     # m further past the gate per retry when Nav2 ends the route short of the crossing; less: the dock is near (exit at most 2.1 m)
time_limit: 240.0
timeout: 240.0
