# Task 1, navigation channel. Labels are the tracker's class ids (/objects/map).
red: red_pole_buoy
green: green_pole_buoy
gates: 2
max_gate_width: 8.0     # m; wider red/green pairs are not one gate
search_distance: 10.0   # m driven ahead while looking for the next gate
time_limit: 180.0       # s, within the mission
timeout: 180.0          # s, when run alone
