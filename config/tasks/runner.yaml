# The task runner (mhseals_nav/tasks/interface.py) and its Nav2 goals, for every task;
# a task's YAML overrides any of these under `runner:`.
exit_settle_s: 3.0        # s of wall time at exit to see each Nav2 goal rejected, ended or its cancel acknowledged
goal_retries: 30          # sends of one route: Nav2 refuses a goal while another winds down
backup_wait_s: 15.0       # s of wall time at start to wait for Nav2's backup server (dock exit) once the navigators are up
refusal_s: 1.0           # s; a goal aborted this soon after it was sent was refused, not driven
stale_success_m: 1.0      # m; succeeded within refusal_s yet this far from the end: the preempted goal's result, resent
pause_topic: /autonomy/pause  # latched pause requests (fence_watchdog's return): end the task, never fight it
