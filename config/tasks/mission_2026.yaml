# The whole run on a 2026 course (crane_ml procedural course-gen, RoboBoat 2026 rules):
# no day's layout, so every task is found by search; the map frame is the start pose.
# Phase 1 baseline: fixed order. Run: run_task --task mission --params <this file>.
tasks: [nav_channel, follow_path, docking, speed_challenge, supply_drop, return_home]
# The run budget is mission.yaml's timeslot (900 s less 180 s of set-up: 720 s), the
# run's `timeout`. Everything below counts from it.
profile: qualifying     # config/tasks/profiles/<profile>.yaml; run_task --profile finals
# The time budget (tasks/budget.py): the exit's time is kept back, and an optional task
# starts only if it is among those worth the time left (points per expected second);
# its own limit is cut to the time left. Points per handbook row (lit-roboboat.md);
# expected_s at the field speed (0.4 m/s): the kinematic course runs (seed 1, both
# sides) x 1.3, until Unity runs refit them.
exit_reserve: 240.0
mandatory: [return_home]
# The tasks after the connected channel and debris field go in the order the course-
# layout belief plans (tasks/layout.py): the most points in the time left, then the
# least time with the way home, re-planned as each one ends.
agenda: [docking, speed_challenge, supply_drop]
# The belief: each task's prior is its search `regions` (handbook and rotation rules),
# moved by what the camera has seen; `labels` seen inside them place the task. A task's
# cost from a place: travel at transit_mps (the speed measured once measure_m were
# driven), search_s_per_m per m of the guess's spread, and its own service_s (kinematic
# 0.4 m/s runs, seed 1, both sides; both scale with the measured speed).
layout:
  transit_mps: 0.35
  measure_m: 50.0
  # The exit's reserve after an agenda task: exit_margin x the way out from where it
  # ends (back through the entry gates, then home) at the measured speed, at least
  # exit_floor_s, never more than exit_reserve. null: always exit_reserve.
  exit_margin: 1.5
  exit_floor_s: 120.0
  search_s_per_m: 3.0
  miss: 0.2               # weight kept by a cell the camera looked at without a find
  tasks:
    docking: {labels: [banner_1, banner_2, banner_3, red_light_beacon, green_light_beacon],
              service_s: 70.0}
    speed_challenge: {labels: [yellow_buoy, red_buoy, green_buoy, red_light_sign,
                               green_light_sign], service_s: 110.0}
# Actuators not built yet (tasks/actuators.py): a task needing only these is worth 0.
capabilities: {water_gun: false, ball_dropper: false, horn: false}
start_look_deg: 90.0    # turn to each side at the start: the marina lies beside it
# Every search: the course box, and the marina's banners and lights fix the side S.
search:
  area: [[-20.0, -60.0], [80.0, 60.0]]
  side_cues: [banner_1, banner_2, banner_3, red_light_beacon, green_light_beacon]
# Task 2, debris clearance: the channel out, circle each green beacon, back the same way.
follow_path:
  red: red_buoy
  green: green_buoy
  count: black_buoy
  rescue: [green_light_buoy]
  rescues: 2
  circle_radius: 2.0
  circle_clockwise: true
  circle_points: 8
  report_labels: [black_buoy, green_light_buoy, red_light_buoy]
  and_back: true
  time_limit: 420.0
  points: 1000.0          # channel gates in and out, green circles, red avoid, report
  expected_s: 320.0
# Task 5, marina: the lowest-numbered free green slip of either pier.
docking:
  indicators: {green_light_beacon: green, red_light_beacon: red}
  numbers: {banner_1: 1, banner_2: 2, banner_3: 3}
  prefer: [green]
  vessels: [boat, black_target_boat, orange_target_boat]
  landmarks: [banner_1, banner_2, banner_3, red_light_beacon, green_light_beacon]
  staging: 4.0
  berth: 1.3
  bay_depth: 2.4
  points: 450.0           # lowest green slip 350, report 100
  expected_s: 150.0
  # The marina lies beside the entry, on side S (unknown until seen): both sides.
  search:
    regions: [{box: [[-15.0, 6.0], [15.0, 30.0]], weight: 4.0, mirror: true}]
    enable: {sweep: true}   # the bounded lawnmower after the views (off in finals)
# Task 3, speed: the yellow mark; the indicator before it sets the way round.
speed_challenge:
  mark: yellow_buoy
  indicators: {red_light_buoy: red, green_light_buoy: green, red_light_sign: red, green_light_sign: green}
  turn: {red: false, green: true}   # red counter-clockwise, green clockwise
  count: black_buoy
  points: 600.0           # loop 200, direction 150, time up to 250 - T... (report 100 not yet)
  expected_s: 380.0       # cue-led search: 292 s port, 280 s starboard (~190 s search, 99 s run)
  # The turn mark is 12-31 m past its red/green gate; the harbor buoy has no gate.
  pair: {label: yellow_buoy, with: [red_buoy, green_buoy], min: 10.0, max: 33.0}
  # Beyond entry gate 2 on side S (fixed by the marina once seen), any heading.
  search:
    regions: [{box: [[15.0, 10.0], [80.0, 60.0]], weight: 4.0, mirror: true}]
    enable: {sweep: true}   # the bounded lawnmower after the views (off in finals)
# Task 4, supply drop: skipped while no delivery actuator is fitted.
supply_drop:
  points: 600.0
  expected_s: 300.0
# Exit: back out through the entry gates (nav_channel's cleared gates), last first.
return_home:
  exit_source: channel
  red: red_pole_buoy
  green: green_pole_buoy
  gates: 2
  red_side: starboard
  home_radius: 35.0
