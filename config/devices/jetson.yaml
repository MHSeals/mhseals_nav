# The camera computer (Orin + ZED 2i + VLP16): perception, no motion.
requires: [zed, gpu]
args: {sim: 'false'}
parts:
  perception:
    launch: perception.launch.py
    # The ZED 2i's IMU and magnetometer are a second IMU and a third heading source beside the FCU's.
    args: {camera: zed, camera_model: zed2i, lidar: velodyne}
    about: What is around the boat - the camera and lidar drivers, the object tracker and the costmap.
    nodes: [zed_node, zed_backend, object_tracker, costmap, lidar_relay_publish]
  host_diagnostic:
    run: [mhseals_nav, host_diagnostic]
    about: This computer's temperature, power mode and free disk on /diagnostics.
    nodes: [host_diagnostic]
