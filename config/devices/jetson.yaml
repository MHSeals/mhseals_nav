# The camera computer (Orin + ZED 2i + VLP16): camera, perception and the lidar, no motion.
# Started on demand (the TUI, through a unit), never on container start.
requires: [zed, gpu]
args: {sim: 'false'}
parts:
  camera: {launch: camera.launch.py, nodes: [zed_node]}
  # Backend, tracker and the perception costmap (/perception/costmap).
  objects: {launch: objects.launch.py, args: {backend: zed}, nodes: [zed_backend, object_tracker, costmap]}
  # velodyne_driver runs on the large-data transport, which no other computer discovers; the
  # relay that carries /points onto the default transport is the proof the part is up.
  sensors: {launch: sensors.launch.py, nodes: [lidar_relay_publish]}
  # Temperature, power mode and free disk on /diagnostics for the TUI's preflight.
  host_diagnostic: {run: [mhseals_testing, host_diagnostic], nodes: [host_diagnostic]}
