# One machine runs the boat and camera computers' parts against the Unity simulator (crane_ml). The simulator
# publishes the sensors, images and detections through sim_bridge, so no driver starts.
extends: [odroid, jetson]
requires: []
args: {sim: 'true'}
parts:
  localization: {args: {source: none}, nodes: [robot_state_publisher, ekf_local, ekf_global, navsat_transform]}
  perception: {args: {camera: sim, lidar: sim}, nodes: [sim_backend, object_tracker, costmap]}
  host_diagnostic: {enabled: false}       # it reports the Orin's temperature and power mode
  sim_bridge:
    launch: sim_bridge.launch.py
    about: The simulator's link (the Unity ROS-TCP endpoint, port ros_port); it stands in for the drivers.
    nodes: [UnityEndpoint]
