# One machine runs the boat and camera parts against the Unity simulator (crane_ml), which
# publishes the sensors, images and detections; sensors starts only its ROS-TCP endpoint.
extends: [odroid, jetson]
requires: []
args: {sim: 'true'}
parts:
  odometry: {args: {fcu: 'false'}}
  ekf: {args: {ekf_startup_context: standalone}}
  camera: {enabled: false}
  objects: {args: {backend: sim}, nodes: [object_tracker]}
  sensors: {nodes: []}
  # No operator laptop and no FCU here. The fence is a map-frame box around the start: the
  # crane course lies within about 15 m of it and the shore about 75 m away.
  watchdogs: {args: {require_operator: 'false', fcu_watchdog: 'false', fence_frame: map,
                     fence_points: '[-40, -40, 40, -40, 40, 40, -40, 40]'},
              nodes: [link_watchdog, fence_watchdog, ekf_input_watchdog]}
  host_diagnostic: {enabled: false}       # it reports the Orin's temperature and power mode
