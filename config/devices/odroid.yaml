# The boat computer: localization (MAVROS, TF and the EKFs), SLAM, Nav2 and the mission runner.
# The drive stack (thruster driver, command_mux) is not a part: start it with
# `ros2 launch mhseals_hardware drive.launch.py`.
requires: [mavros]
args: {sim: 'false'}
parts:
  # MAVROS and its relays, the robot TF, and the EKFs and navsat_transform (odom.launch.py includes
  # ekf.launch.py).
  localization: {launch: odom.launch.py, args: {fcu: 'true'},
                 nodes: [robot_state_publisher, ekf_local, ekf_global, navsat_transform]}
  mapping: {launch: slam.launch.py, nodes: [rtabmap]}
  navigation: {launch: navigation.launch.py, nodes: [bt_navigator], kind: commander}
  # Runs no task unless one is given: overrides '{"parts": {"mission": {"args": {"task": "mission"}}}}'.
  mission: {launch: task.launch.py, nodes: [run_task], kind: commander}
