# The boat computer: localization, mapping, navigation and the mission runner.
# The drive stack (thruster driver, command_mux) is not a part: ros2 launch mhseals_hardware drive.launch.py.
requires: [mavros]
args: {sim: 'false'}
parts:
  localization:
    launch: localization.launch.py
    args: {source: fcu}
    about: Where the boat is - the robot TF and the two EKFs, fed by the source (fcu is MAVROS).
    nodes: [mavros_node, robot_state_publisher, ekf_local, ekf_global, navsat_transform]
  mapping:
    launch: navigation.launch.py
    args: {nav2: 'false', mapping: 'true'}
    about: A map of the course from the lidar and camera (RTAB-Map), without navigating.
    nodes: [rtabmap]
  navigation:
    launch: navigation.launch.py
    kind: commander
    about: Drives the boat to goals (Nav2).
    nodes: [bt_navigator, controller_server, planner_server, velocity_smoother]
  mission:   # no task unless one is given: overrides '{"parts": {"mission": {"args": {"task": "mission"}}}}'
    launch: mission.launch.py
    kind: commander
    about: Runs a task tree or the whole mission (no task unless one is given).
    nodes: [run_task]
