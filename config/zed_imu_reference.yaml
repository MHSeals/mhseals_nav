# ZED 2i IMU and magnetometer as ekf_local's second yaw reference (zed_imu_reference.py).
# camera.launch.py starts it on the Orin beside the wrapper; the EKF on the ODROID reads
# /imu/zed (gyro) and /imu/zed_heading (magnetic heading) best effort.
zed_imu_reference:
  ros__parameters:
    # The wrapper publishes 200 Hz (zed_boat.yaml sensors_pub_rate); the EKF gets every 2nd.
    rate_divisor: 2
    # rad/s. Above the FCU's 0.00035 so a ZED gyro bias cannot steer the fused yaw rate while
    # the FCU streams; the ZED carries the rate through an FCU stall.
    gyro_stddev_floor: 0.005
    # Off until the ZED magnetometer is calibrated on the boat with the ZED tools (bench list,
    # mhseals_testing#1). Then set true with the site's declination (east positive, deg):
    # 2.8 at the Texas test pond (WMM, fcu_changes.md 2026-10-24); look Sarasota up in the WMM.
    heading_enabled: false
    heading_stddev: 0.1          # rad; the FCU compass heading is fused at 0.2
    declination_deg: 0.0
