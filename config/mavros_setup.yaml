mavros_setup:
  ros__parameters:
    # Desired requests, repeated on reconnect; delivery remains unverified.
    message_rates:
      - '33:20'
      - '30:50'
      - '31:50'
      - '24:5'
      - '27:10'
      - '1:2'
      - '193:2'
      - '65:25'
    retry_attempts: 3
    retry_delay: 8.0
    response_timeout: 5.0
    service_wait: 10.0
    reboot_dedupe_window: 5.0
