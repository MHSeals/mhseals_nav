mavros_setup:
  ros__parameters:
    # Desired requests, repeated on reconnect; delivery remains unverified.
    # ArduPilot denies intervals under 1.25 loop periods, so every 100 Hz request needs
    # SCHED_LOOP_RATE 200 (written 11-01, config/fcu/odom-100hz.proposed.param); at 50 the FCU
    # refuses them and mavros_setup logs "rates short" every verify_period.
    # - 31 ATTITUDE_QUATERNION 100 Hz: /mavros/imu/data -> /imu/raw (orientation and body rates);
    #   MAVROS ignores 30 ATTITUDE once 31 arrives, so 30 is the 25 Hz fallback.
    # - 27 RAW_IMU 100 Hz: the primary IMU's accel and gyro (/mavros/imu/data_raw) and the
    #   compass (/mavros/imu/mag).
    # - 24 GPS_RAW_INT 10 Hz: /gps/fix. The Here4 (u-blox F9P) makes 10 Hz RTK with 3 GNSS
    #   (20 Hz only GPS alone), set on its DroneCAN node: GPS1_RATE_MS 100, GPS1_GNSS_MODE 69
    #   (config/fcu/blastoise_gnss_proposal.param). At the node's old 200 ms half of these
    #   repeat the last fix, so check the unique rate (TEST-20261104-pool bring-up).
    # - 33 GLOBAL_POSITION_INT 20 Hz: the FCU EKF's fused position, above the receiver's rate.
    message_rates:
      - '33:20'
      - '30:25'
      - '31:100'
      - '24:10'
      - '27:100'
      - '1:2'
      - '193:2'
      - '65:25'
    retry_attempts: 3
    retry_delay: 8.0
    response_timeout: 5.0
    service_wait: 10.0
    reboot_dedupe_window: 5.0
    # Ids arriving below 0.7 of their rate over this span are requested again.
    verify_period: 30.0
    # RC diagnostics only; does not change mux authority or stale-frame timeout.
    rc_window: 5.0
    rc_min_hz: 10.0
    rc_min_channels: 8
    rc_grace: 10.0
    rc_timer: 1.0
    # Source filter for observed MAVLink, not a MAVROS request-target setting.
    fcu_sysid: 1
