mavros_setup:
  ros__parameters:
    # Desired requests, repeated on reconnect; delivery remains unverified.
    # /mavros/imu/data -> /imu/raw comes from ATTITUDE_QUATERNION (31) once it arrives; MAVROS
    # then ignores ATTITUDE (30). ArduPilot denies intervals under 1.25 loop periods: at
    # SCHED_LOOP_RATE 50 it refuses 31 at 100 Hz, so /imu/raw stays on 30 at 25 Hz (accepted
    # 2026-10-25) and the 31 shortfall is logged every verify_period. At 200
    # (config/fcu/odom-100hz.proposed.param) 31 runs at 100 Hz.
    # GPS_RAW_INT (24) stays at the Here4's current 5 Hz. The FCU repeats the last fix at the
    # requested rate and nothing downstream drops repeats, so request no more than the receiver
    # makes: set 24:10 only after the node shows 10 Hz (config/fcu/blastoise_gnss_proposal.param).
    message_rates:
      - '33:20'
      - '30:25'
      - '31:100'
      - '24:5'
      - '27:10'
      - '1:2'
      - '193:2'
      - '65:25'
    retry_attempts: 3
    retry_delay: 8.0
    response_timeout: 5.0
    service_wait: 10.0
    reboot_dedupe_window: 5.0
    # Ids arriving below 0.7 of their rate over this span are requested again.
    verify_period: 30.0
    # RC diagnostics only; does not change mux authority or stale-frame timeout.
    rc_window: 5.0
    rc_min_hz: 10.0
    rc_min_channels: 8
    rc_grace: 10.0
    rc_timer: 1.0
    # Source filter for observed MAVLink, not a MAVROS request-target setting.
    fcu_sysid: 1
