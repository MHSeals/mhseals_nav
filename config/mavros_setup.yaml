mavros_setup:
  ros__parameters:
    # Desired requests, repeated on reconnect; delivery remains unverified.
    # ATTITUDE (30) feeds /mavros/imu/data -> /imu/raw. At SCHED_LOOP_RATE 50 the FCU
    # refuses 50 Hz and keeps SR0_EXTRA1's 4 Hz; 25 Hz is accepted (2026-10-25).
    # GPS_RAW_INT (24) matches the Here4's 10 Hz (its node GPS1_RATE_MS 100, config/fcu/
    # blastoise_gnss_proposal.param). The FCU repeats the last fix at the requested rate, so
    # request no more than the receiver makes: until the node runs at 10 Hz each fix comes twice.
    message_rates:
      - '33:20'
      - '30:25'
      - '31:25'
      - '24:10'
      - '27:10'
      - '1:2'
      - '193:2'
      - '65:25'
    retry_attempts: 3
    retry_delay: 8.0
    response_timeout: 5.0
    service_wait: 10.0
    reboot_dedupe_window: 5.0
    # Ids arriving below 0.7 of their rate over this span are requested again.
    verify_period: 30.0
    # RC diagnostics only; does not change mux authority or stale-frame timeout.
    rc_window: 5.0
    rc_min_hz: 10.0
    rc_min_channels: 8
    rc_grace: 10.0
    rc_timer: 1.0
    # Source filter for observed MAVLink, not a MAVROS request-target setting.
    fcu_sysid: 1
