# approach_guard (B): hold the boat while an obstacle closes in on the hull from any side
# (S-overtake: MPPI scores only the path ahead). An approach is a lethal cell within
# trigger_m of the hull more than move_m from every known lethal cell, in the costmap's
# world frame (odom); known = first lethal min_age_s ago or more and seen again within
# memory_s. Static buoys and the dock stay known, a hull moving faster than about
# move_m / min_age_s keeps marking new water.
# The new cells must also chain (each within max_speed of the last, through up to miss_s
# of dropouts), so scattered clutter (spray, wake) does not chain. Slower than move_m / min_age_s
# (0.6 m/s, odom frame) is never new: a boat closing that slowly is not held for.
# Dense flicker (about 10+ specks a snapshot for tens of seconds) turns cells known and
# masks an approach: it fails open, and is for the water bags to size.
# Hold-only like the other watchdogs: a hold ends the task and the operator releases (U).
# Autonomy includes a station-keeping zero, so a boat holding station is guarded too.
# enforce false only logs ("closing in on the hull" warnings) and reports on report_topic
# what it would hold on (enforcing, it reports what it holds on). navigation.launch.py
# enforces in sim; keep the boat log-only until a water bag with /perception/costmap
# recorded replays with no false approach.
/**:
  ros__parameters:
    costmap_topic: /perception/costmap
    updates_topic: /perception/costmap_updates
    command_topic: /cmd_vel            # Nav2 -> command_mux auto input
    request_topic: /command_mux/request
    report_topic: /approach_guard/approach   # String JSON {gap_m, at, enforce}, <= 1/repeat_s
    cause: approach
    enforce: false           # false: log approaches, request no hold
    base_frame: base_link
    half_length_m: 0.5315    # the hull, as nav2_params' footprint without its padding
    half_width_m: 0.4475
    lethal: 100              # OccupancyGrid value of a lethal cell
    trigger_m: 4.0           # hull gap watched; S-overtake holds at about 2.7 m
    move_m: 0.6              # 4 cells of the 0.15 m costmap: edge flicker stays under
    min_age_s: 1.0           # so a hull moving at >= 0.6 m/s (world) is seen
    memory_s: 30.0           # sim: buoys near the hull drop out of the lidar for 7-19 s
    warmup_s: 5.0            # after a start or a stale spell, learn what is static first
    max_speed: 2.0           # m/s an approaching edge may move between snapshots
    cluster_m: 0.25          # new cells this close (a cell and its diagonal) are one cluster
    min_cluster: 6           # cells: spray and wake are specks, a 1 x 0.5 m hull is about 28
    miss_s: 0.4              # snapshots without a new cell a chain survives (2 at 5 Hz)
    max_chains: 20           # chains followed at once, oldest first
    min_hits: 0.6            # share of a chain's snapshots that must extend it
    crop_m: 6.0              # around the base: past trigger_m + move_m + the hull
    confirm_s: 1.5           # a chain this long (sim dock reveals: up to 1.0 s)
    recent_s: 0.5            # an approach counts this long (a timer apart from rate_hz)
    command_window_s: 0.5    # autonomy = an auto command within this window
    repeat_s: 1.0
    max_costmap_age_s: 1.0   # receipt age (5 Hz); stale is costmap_watchdog's hold
    max_tf_age_s: 1.0
    rate_hz: 5.0
