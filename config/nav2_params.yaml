# Omni MPPI: the X thrusters can sway, so the controller may slide sideways to
# hold a line through a gate or into a dock, but it prefers facing along the
# path because the camera looks forward. Velocity limits are overwritten from
# the characterization (thrust_characterize --nav2-overlay). The hull footprint
# is simulation-derived and needs hardware validation; see the workspace
# README before connecting any actuator.
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odom/local
    # MPPI shifts its plan one model_dt per cycle, so the loop must keep its rate;
    # 10 Hz holds on a loaded onboard computer where 20 Hz slipped and the boat circled.
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker, precise_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    # Waves alone keep a floating boat moving at about 0.1 m/s, so ordinary goals
    # only need the pose; docking (behavior_trees/nav_precise.xml) also needs it settled.
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.5
    precise_goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25    # gusts keep a berthed boat stirring
      rot_stopped_velocity: 0.25
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Omni
      time_steps: 28
      model_dt: 0.1             # = 1 / controller_frequency
      batch_size: 1000
      iteration_count: 1
      # Low temperature: commit to the best samples; a floating boat's odometry is
      # noisy (waves) and its response lags, which a high temperature averages away.
      temperature: 0.1
      gamma: 0.015
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.6
      vx_min: -0.2
      vy_max: 0.3
      wz_max: 0.5
      ax_max: 0.4
      ax_min: -0.4
      ay_max: 0.4
      az_max: 0.6
      prune_distance: 3.0       # at least vx_max x the horizon (0.6 m/s x 2.8 s), with margin
      transform_tolerance: 0.2
      retry_attempt_limit: 2
      enforce_path_inversion: false
      visualize: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic,
                PathFollowCritic, PathAngleCritic, PreferForwardCritic, TwirlingCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 2.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      # Face along the path (mode 0): the camera and lidar look forward.
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      update_frequency: 10.0
      publish_frequency: 10.0
      width: 12
      height: 12
      resolution: 0.05
      footprint: "[[0.5315, 0.4475], [0.5315, -0.4475], [-0.5315, -0.4475], [-0.5315, 0.4475]]"
      footprint_padding: 0.05
      plugins: [obstacle_layer, inflation_layer]
      # Spatio-temporal voxels that decay: over open water a LiDAR's rays mostly
      # return nothing, so nothing would ever clear a mark; the local map lets go after 3 s.
      obstacle_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 3.0
        decay_model: 0             # linear, seconds
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud objects
        # Camera-tracked objects (object_tracker): the LiDAR's rings pass over a
        # 0.15 m buoy up close; marking only, the voxel decay clears them.
        objects:
          topic: /objects/points
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -1.5
          max_obstacle_height: 3.0
          obstacle_range: 20.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_filter: false
          clear_after_reading: true
          model_type: 1
          vertical_fov_angle: 0.52
          vertical_fov_offset: 0.0
          horizontal_fov_angle: 6.28
          decay_acceleration: 0.0
        pointcloud:
          topic: /points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -1.5
          max_obstacle_height: 3.0
          obstacle_range: 20.0
          expected_update_rate: 0.5
          # Period in seconds, not Hz. Missing observations make the costmap stale.
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_filter: false
          clear_after_reading: true
          model_type: 1            # 3-D LiDAR frustum: VLP-16, 360 by +-15 degrees
          vertical_fov_angle: 0.52
          vertical_fov_offset: 0.0
          horizontal_fov_angle: 6.28
          decay_acceleration: 5.0
      # Narrow enough for a 6 ft (1.83 m) gate: the hull is 0.9 m wide, so
      # each side has about 0.4 m. Cost still falls off toward the middle.
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 6.0
        inflation_radius: 0.6
      always_send_full_costmap: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      # A waypoint inside an obstacle's margin (just past a gate, by a buoy) ends at
      # the nearest free cell within this distance instead of failing.
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      track_unknown_space: false
      # Mapless local-horizon planning assumes unobserved water is free, NOT verified safe.
      update_frequency: 5.0
      publish_frequency: 5.0
      # A RoboBoat course spans about 100 m; plans reach any task area from anywhere.
      width: 100
      height: 100
      resolution: 0.10
      footprint: "[[0.5315, 0.4475], [0.5315, -0.4475], [-0.5315, -0.4475], [-0.5315, 0.4475]]"
      footprint_padding: 0.05
      plugins: [obstacle_layer, inflation_layer]
      # Spatio-temporal voxels that decay: over open water a LiDAR's rays mostly
      # return nothing, so nothing would ever clear a mark; the global map keeps a buoy 15 s after it leaves view.
      obstacle_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 15.0
        decay_model: 0             # linear, seconds
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud objects
        # Camera-tracked objects (object_tracker): the LiDAR's rings pass over a
        # 0.15 m buoy up close; marking only, the voxel decay clears them.
        objects:
          topic: /objects/points
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -1.5
          max_obstacle_height: 3.0
          obstacle_range: 20.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_filter: false
          clear_after_reading: true
          model_type: 1
          vertical_fov_angle: 0.52
          vertical_fov_offset: 0.0
          horizontal_fov_angle: 6.28
          decay_acceleration: 0.0
        pointcloud:
          topic: /points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -1.5
          max_obstacle_height: 3.0
          obstacle_range: 20.0
          expected_update_rate: 0.5
          # Period in seconds, not Hz. Missing observations make the costmap stale.
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_filter: false
          clear_after_reading: true
          model_type: 1            # 3-D LiDAR frustum: VLP-16, 360 by +-15 degrees
          vertical_fov_angle: 0.52
          vertical_fov_offset: 0.0
          horizontal_fov_angle: 6.28
          decay_acceleration: 5.0
      # Narrow enough for a 6 ft (1.83 m) gate: the hull is 0.9 m wide, so
      # each side has about 0.4 m. Cost still falls off toward the middle.
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 6.0
        inflation_radius: 0.6
      always_send_full_costmap: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom/local
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 60.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code]

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.6, 0.3, 0.5]
    min_velocity: [-0.2, -0.3, -0.5]
    max_accel: [0.4, 0.4, 0.6]
    max_decel: [-0.4, -0.4, -0.6]
    odom_topic: /odom/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
