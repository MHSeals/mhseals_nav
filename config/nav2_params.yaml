# Low-speed RPP profile; simulation-derived hull footprint needs hardware validation.
# See docs/nav2-commissioning.md before connecting any actuator.
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odom/local
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      stateful: false
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.35
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.05
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.4
      lookahead_dist: 2.0
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      use_collision_detection: true
      use_rotate_to_heading: true
      allow_reversing: false
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 4.0
      max_robot_pose_search_dist: 10.0
      max_angular_accel: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      update_frequency: 10.0
      publish_frequency: 2.0
      width: 12
      height: 12
      resolution: 0.10
      footprint: "[[0.5315, 0.4475], [0.5315, -0.4475], [-0.5315, -0.4475], [-0.5315, 0.4475]]"
      footprint_padding: 0.01
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        max_obstacle_height: 3.0
        observation_sources: pointcloud
        pointcloud:
          topic: /points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -1.5
          max_obstacle_height: 3.0
          obstacle_min_range: 1.0
          obstacle_max_range: 20.0
          raytrace_min_range: 1.0
          raytrace_max_range: 25.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
          # Period in seconds, not Hz. Missing observations make the costmap stale.
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      always_send_full_costmap: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.05
      use_astar: true
      allow_unknown: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      track_unknown_space: false
      # Mapless local-horizon planning assumes unobserved water is free, NOT verified safe.
      update_frequency: 2.0
      publish_frequency: 1.0
      width: 60
      height: 60
      resolution: 0.10
      footprint: "[[0.5315, 0.4475], [0.5315, -0.4475], [-0.5315, -0.4475], [-0.5315, 0.4475]]"
      footprint_padding: 0.01
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        max_obstacle_height: 3.0
        observation_sources: pointcloud
        pointcloud:
          topic: /points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -1.5
          max_obstacle_height: 3.0
          obstacle_min_range: 1.0
          obstacle_max_range: 20.0
          raytrace_min_range: 1.0
          raytrace_max_range: 25.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      always_send_full_costmap: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom/local
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 60.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code]

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.4, 0.0, 0.4]
    min_velocity: [0.0, 0.0, -0.4]
    max_accel: [0.2, 0.0, 0.3]
    max_decel: [-0.2, 0.0, -0.3]
    odom_topic: /odom/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
