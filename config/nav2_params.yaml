bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.005
    min_theta_velocity_threshold: 0.005
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 25.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.4

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      time_steps: 50
      model_dt: 0.15
      batch_size: 3000
      iterations: 4           # was 2 — extra pass helps resolve orientation ambiguity

      vx_max: 0.9
      vx_min: 0.0          # tiny reverse prevents getting fully stuck
      wz_max: 0.97
      ax_max: 0.3
      ax_min: -0.3
      az_max: 0.2
      az_min: -0.2

      vx_std: 0.12            # was 0.1 — explore more forward speeds
      wz_std: 0.10            # was 0.14 — less yaw exploration, fewer spin trajectories
      temperature: 0.25        # was 0.2 — less greedy, escapes bad local orientation
      gamma: 0.07             # was 0.025 — smoother outputs

      motion_model: "DiffDrive"

      critics:
        - GoalCritic
        - PathAlignCritic
        - PathFollowCritic
        - ObstaclesCritic
        - PreferForwardCritic
        - VelocityDeadbandCritic

      PathFollowCritic.weight: 18.0       # was 22 — smac paths are cleaner, less grip needed
      PathFollowCritic.offset_from_furthest: 6    # was 4 — smac spacing is even so lookahead is safe to increase slightly
      PathAlignCritic.weight: 14.0        # was 18 — smac provides orientation so less correction needed
      PathAlignCritic.max_path_occupancy_ratio: 0.07
      PathAlignCritic.use_path_orientations: true
      GoalCritic.weight: 8.0
      GoalCritic.threshold_to_consider: 1.2
      ObstaclesCritic.weight: 25.0
      PreferForwardCritic.weight: 22.0
      VelocityDeadbandCritic.weight: 8.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: True
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.4
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 12
        max_obstacle_height: 1.2
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /points
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 20.0
          raytrace_min_range: 1.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0  # add this — don't persist old observations
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 3.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 200
      height: 200
      robot_radius: 0.5
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud
        pointcloud:
          topic: /points
          max_obstacle_height: 1.5
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 15.0
          raytrace_min_range: 1.0
          obstacle_max_range: 15.0
          obstacle_min_range: 1.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0  # was 20, navfn is gone, smac needs less frequency
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 2.0
      motion_model_for_search: "DUBIN"  # boat doesn't reverse, Dubin is correct
      angle_quantization_bins: 72       # 5 degree resolution
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.6       # tune to your boat's actual min turn
      reverse_penalty: 10.0             # heavily discourage reverse in the plan itself
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      retrospective_penalty: 0.025
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true                 # smooth before handing to MPPI

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 5.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 8.0

lifecycle_manager:
  ros__parameters:
    autostart: true

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 1

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [4.0, 0.0, 8.0]
    min_velocity: [-4.0, 0.0, -8.0]
    max_accel: [2.5, 0.0, 3.0]
    max_decel: [-2.5, 0.0, -8.0]
    odom_topic: "/odom/local"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0