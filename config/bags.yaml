# Bag presets for `astro rec start [preset]` (astro reads this file through the vessel profile's
# astro.bags). presets: name -> topic list, or `all` (every topic but those matching `exclude`).
presets:
  # Control and state: what the characterization tests and the day log need. Small enough for hours.
  lean: [/events, /tf, /tf_static,
         /cmd_vel, /cmd_vel_nav, /cmd_vel_effort, /cmd_vel/manual, /cmd_vel/applied,
         /command_mux/state, /thrusters/pwm, /mavros/rc/in, /mavros/state, /mavros/battery,
         /odom/local, /odom/global, /odom/mavros, /odom/gps,
         /imu/raw, /mavros/imu/data, /mavros/imu/mag, /localization/heading_guard,
         /mavros/global_position/raw/fix, /mavros/gpsstatus/gps1/raw, /rtk/status]
  # lean plus Nav2: plans, goals, costmap updates and the navigator's state (trial runs).
  nav: [/events, /tf, /tf_static,
        /cmd_vel, /cmd_vel_nav, /cmd_vel_effort, /cmd_vel/manual, /cmd_vel/applied,
        /command_mux/state, /thrusters/pwm, /mavros/rc/in, /mavros/state, /mavros/battery,
        /odom/local, /odom/global, /odom/mavros, /odom/gps,
        /imu/raw, /mavros/imu/data, /mavros/imu/mag, /localization/heading_guard,
        /mavros/global_position/raw/fix, /mavros/gpsstatus/gps1/raw, /rtk/status,
        /plan, /local_plan, /goal_pose, /trajectories, /speed_limit,
        /local_costmap/costmap, /local_costmap/costmap_updates,
        /global_costmap/costmap, /global_costmap/costmap_updates,
        /perception/costmap, /perception/nearest_obstacle,
        /navigate_through_poses/_action/feedback, /navigate_through_poses/_action/status,
        /navigate_to_pose/_action/feedback, /navigate_to_pose/_action/status]
  # Everything but images and point clouds (the radio and disk can't take them for long).
  all: all
exclude: 'image|points|point_cloud|depth|disparity|confidence|compressed|camera_info'
