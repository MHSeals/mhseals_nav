# fence_watchdog (B): autonomy must stay inside the day's course area (FCU FENCE_ENABLE=0,
# and the FCU does not drive the thrusters). While autonomy commands flow and the boat is
# outside the fence, or within margin_m of its edge and moving outward faster than
# outward_speed_mps or facing within outward_angle_deg of the outward normal, it requests a
# command_mux hold. The operator clears it with U; it releases its own hold once inside again
# for release_after with the FCU disarmed (armed, it stays until U).
# No valid fence, or position or odometry older than max_age_s, holds as well.
#
# The fence is the day's course area in fence_file (plain YAML, it overrides fence_frame and
# fence_points here), for example:
#   fence_frame: latlon                  # latlon: [lat, lon] pairs; map: [x, y] m in map
#   fence_points: [42.000, -71.000, 42.000, -70.999, 42.001, -70.999, 42.001, -71.000]
# Lat/lon is the one to use on the water: map's origin is wherever the boat started
# (navsat_transform wait_for_datum: false). fence_points is a flat list of at least 3 vertex
# pairs; a launch may pass it as a parameter instead (sim: a map-frame box). The TUI saves
# course: {corners: [...], on_exit: alert|return} there; that on_exit wins over the one below at
# startup (an invalid one keeps it, with a warning).
/**:
  ros__parameters:
    fence_file: ~/.config/mhseals/fence.yaml
    fence_frame: latlon
    odom_topic: /odom/global           # EKF (map): heading and velocity; position for map fences
    gps_topic: /gps/filtered           # navsat_transform's lat/lon of /odom/global
    command_topic: /cmd_vel            # Nav2 -> command_mux auto input
    request_topic: /command_mux/request
    cause: geofence
    margin_m: 5.0                      # covers the coast after a neutral-thrust hold
    outward_speed_mps: 0.1             # outward ground speed that counts as leaving
    outward_angle_deg: 60.0            # heading this close to the outward normal counts too
    max_age_s: 1.0                     # receipt age of the position and odometry
    command_window_s: 0.5              # autonomy = an auto command within this window
    mux_state_topic: /command_mux/state # its input says what auto reaches
    mux_state_max_age_s: 2.5           # the mux republishes >= 1 Hz; older counts every command
    fence_topic: /fence_watchdog/fence # latched JSON: this fence in its own frame (latlon or map), the margin
    fence_rate_hz: 1.0                 #   rules, for the TUI's goal gates (one source)
    # std_srvs/Trigger: move a map fence to the boat (fresh position or refused), same shape,
    # keeping the boat where the map origin was (the start of the test). A lat/lon course area
    # stays fixed (success, "course area fixed"). Called by the characterization start.
    anchor_service: /fence/anchor
    anchor_max_speed_mps: 0.5          # refused faster than this, or without fresh odometry
    marker_topic: /fence/marker        # latched visualization_msgs/Marker LINE_STRIP for rviz
    marker_frame: map                  # odom_topic's frame: marker, return goals
    marker_width: 0.3                  # m
    marker_color: [1.0, 0.6, 0.0, 1.0] # r g b a
    marker_outside_color: [1.0, 0.0, 0.0, 1.0]  # while the boat is outside
    # Live parameters (ros2 param set): course.corners [lat1, lon1, ...] replaces the fence with
    # that lat/lon course area (>= 3 corners, a simple polygon, or refused); on_exit as below.
    # Outside under autonomy, alert holds; return sends navigate_to_pose one goal return_inset m
    # inside the nearest edge at return_speed (m/s, Nav2's speed limit), and holds as alert does
    # when not back inside within return_timeout (s), the mux leaves auto or the goal ends.
    on_exit: alert
    return_inset: 10.0
    return_speed: 0.5
    return_timeout: 15.0
    return_action: navigate_to_pose
    speed_limit_topic: /speed_limit
    # JSON {inside, distance_to_edge, frame, on_exit, corners, returning}
    status_topic: /fence/status
    status_rate: 2.0                   # Hz, and on every change
    repeat_s: 1.0
    release_after: 3.0                 # s clear, FCU disarmed: release its own hold
    fcu_state_topic: /mavros/state
    fcu_state_max_age: 3.0             # s; older armed state counts as armed
    rate_hz: 10.0
