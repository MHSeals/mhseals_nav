navsat_transform:
  ros__parameters:
    frequency: 20.0
    delay: 0.0

    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true

    publish_filtered_gps: false
    use_odometry_yaw: true
    wait_for_datum: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom