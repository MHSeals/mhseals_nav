# lidar_fusion: lidar range adjustment of camera observations (lidar-fusion-design.md rev 2).
# enabled: objects.launch.py starts the node, points the tracker at output_topic and sets the
# tracker's meas.depth_term false (the covariance here carries the stereo depth term).
# Class radii and the stereo model (depth_k, min_sigma_m, range_frac) come from tracker.yaml.
/**:
  ros__parameters:
    enabled: false
    observations_topic: /perception/observations
    output_topic: /perception/observations_fused
    sources_topic: /perception/fusion_sources   # JSON source label per output observation
    camera_info_topic: /front/zed_node/rgb/color/rect/camera_info
    camera_frame: ''              # '' = the observations' header frame
    camera_axes: auto             # optical | body | auto ('optical' in the frame name)
    points_topic: /points
    points_transport: relay       # relay: large-data graph via lidar_relay.receive; direct: sim
    odom_frame: odom
    base_frame: base_link
    attitude_topic: /imu/raw      # the EKF's yaw source; '' = no rate check
    image_time_offset_s: 0.0      # t_c = stamp + this (measure on the mast)
    # Scan handling
    r_min_m: 2.0
    omega_max_rad_s: 1.5          # crop margin: hfov/2 + 5 deg + omega_max * 0.2 s
    scans_kept: 3
    scan_max_dt_s: 0.1
    tf_wait_s: 0.15
    image_margin_px: 10.0
    water_z_m: -0.6               # water plane in base_link (z up); measured on the mast
    water_range_m: 6.0
    # Gate
    tf_max_gap_s: 0.06
    attitude_min_hz: 20.0
    sigma_omega: 0.05             # rad/s, attitude at >= attitude_min_hz
    sigma_omega_slow: 0.3         # rad/s, below it
    sigma_t_s: 0.005
    e_mc_max_deg: 0.6
    # Candidates, clusters, association
    delta_h_deg: 0.3
    margin_v_deg: 2.0
    delta_a_rad: 0.00349          # 0.2 deg azimuth step
    divergence_rad: 0.003
    gap_min_m: 0.3
    ring_spacing_deg: 2.0
    n_frac: 0.3
    # rho_obj = median near face + k R, k of the longest class-name suffix listed. 0.87 is a
    # vertical cylinder; the others are fitted on sim E0 lidar ranges (S1, S3, S4, S6, 5 seeds:
    # balls read +0.041 m and pole buoys +0.124 m long at 0.87). Refit from boat bags.
    near_face_k:
      default: 0.87
      buoy: 0.67                  # a sphere's rings hit chords: (pi/4)^2 = 0.62 in theory
      pole_buoy: 0.38             # the lidar sees the narrow pole, not the 0.25 m class disc
    gate_pad_m: 0.3
    iou_min: 0.3
    accept_cost: 1.0
    ambiguity_cost: 0.15
    merge_w_frac: 1.6
    # Covariance
    sigma_w_m: 0.03
    bias_radius_frac: 0.15
    # Calibrated (board, design §6) value, required before enabling. Sim E0 per-pass lidar
    # bias was 0.029 m RMS after the near-face fit, which 0.15 R alone covers; 0.05 tripled
    # sigma_r and held the fused track NEES at 0.16-0.43.
    sigma_t_ext_m: 0.02
    bias_time_s: 1.0
    box_beta_frac: 0.05
    split_beta_rad: 0.0052
    sigma_z_m: 0.5
    rate_alpha: 0.3
    default_hz: 10.0
    # Held ratio: the stereo bias moves a lot between frames (sim ACF 0.86 at 0.125 s), so
    # keep the latest lidar ratio (alpha 1) and shrink it by e^(-age/tau). tau 1.5 s gave the
    # least held MSE on sim E0 (the depth noise alone fits 0.9 s; a box offset persists).
    held_alpha: 1.0
    held_s: 2.0
    held_tau_s: 1.5
    # Extrinsic estimate (detect and alert; applies at most apply_max_deg)
    isolation_deg: 2.0
    border_px: 2.0
    sample_max_range_m: 10.0
    sample_window_deg: 1.5
    extrinsic:
      window_n: 60
      min_n: 30
      stride: 10                  # S2 gave ~1 sample/s: at 20 its only fit fell in the spin
      sample_dt_s: 0.2
      sigma_u_px: 1.5
      # Weak priors [w_x, w_y, w_z (rad), c_x, c_y, c_z (m), tau (s)] keep the fit regular.
      prior_sigma: [0.1, 0.1, 0.1, 0.2, 0.2, 0.2, 0.1]
      apply_se_deg: 0.2
      apply_max_deg: 1.0
      warn_deg: 0.75
      warn_windows: 3
      error_deg: 1.5
      k_se: 4.0
      alert_c_m: 0.05
      alert_tau_s: 0.015
      silent_window_s: 20.0
      silent_min_boxes: 20
      silent_frac: 0.05
