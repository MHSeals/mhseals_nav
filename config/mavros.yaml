/**:
  ros__parameters:
    system_id: 255
    component_id: 240
    # Only what the stack consumes: the default loads every plugin (~60 nodes).
    plugin_allowlist:
      - sys_status
      - sys_time
      - command
      - param
      - imu
      - global_position
      - gps_status
      - gps_rtk
      - rc_io
      - setpoint_velocity
      - mag_calibration_status
# /imu/raw (relayed /mavros/imu/data) feeds the EKFs' yaw. MAVROS's default orientation_stdev
# of 1.0 rad held the EKF yaw sigma near 12.7 deg on 2026-10-25. 0.1 rad (5.7 deg) is
# conservative: the FCU's compass innovation ratio was 0.42 under way, but ArduRover has
# no compassmot here and the known-heading magcal is still pending.
/mavros/imu:
  ros__parameters:
    orientation_stdev: 0.1
