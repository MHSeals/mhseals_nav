# mount_check: pre-run sensor mount checks from a short dock bag (mhseals_nav/mount_check.py).
# SI units: lengths in base_link metres, angles in radians, times in seconds.
mount_check:
  topics:
    points: /points
    imu: /imu/raw
    image: /front/zed_node/rgb/color/rect/image
    camera_info: /front/zed_node/rgb/color/rect/camera_info
    tf_static: /tf_static         # the bag's mounts when recorded; else the repo URDF
  attitude_max_dt: 0.05           # a scan or frame takes the FCU attitude nearest its stamp
  buoy:                           # taped buoy: returns are its near face
    radius: 0.125
    gate: 1.0                     # clusters within this of the taped centre
    cluster_gap: 0.1              # returns closer than this are one object
    fit_tolerance: 0.03           # rms of the returns about the fitted circle
    min_points: 5
    range_tolerance: 0.15
    bearing_tolerance: 0.0175     # 1 deg is 10 cm at 6 m
  water:
    range: [2.0, 8.0]             # planar range of the returns fitted
    band: [-1.0, 0.5]             # z of the returns tried: 5 deg of tilt moves water 0.7 m at 8 m
    # Water height at the boat (the plane's intercept): tape it once at the dock (water to the
    # datum, the hull tops at -0.0126) and set waterline; null falls back to waterline_range,
    # between the hull bottoms (about -0.25 in the URDF) and just under the hull tops.
    waterline: null
    waterline_band: 0.05
    waterline_range: [-0.35, -0.05]
    max_tilt: 0.15                # planes further from level are walls, not water
    plane_tolerance: 0.05
    min_points: 60
    min_spread: 0.5               # inlier spread on the narrower horizontal axis
    candidates: 3                 # planes tried per scan; the lowest that passes is the water
    sectors: 8                    # azimuth sectors around the boat
    min_sectors: 4                # occupied sectors, not all in one half: a dock covers one side
    sector_min_points: 10
  horizon:
    min_inliers: 0.6              # share of image columns on the water edge line
    edge_min: 20.0                # grey-level step of a strong edge
    texture_rows: 8               # rows under an edge that must look like water
    texture_max: 6.0              # their mean grey-level step
    # Elevation of the water edge above level: -camera height / shore distance (0.4 m at 150 m
    # is -0.0027); 0 for open water.
    shore_elevation: 0.0
    # Glassy water mirrors the treeline: two parallel edges at most mirror_span apart whose band
    # is symmetric (flipped correlation >= the high end) put the water edge at their midline;
    # between the ends is ambiguous.
    mirror_span: 0.25
    mirror_correlation: [0.15, 0.5]
  verdict:
    tilt_warn: 0.0087             # 0.5 deg
    tilt_error: 0.026             # 1.5 deg
    spread_warn: 0.0087           # scan-to-scan standard deviation of the estimate
