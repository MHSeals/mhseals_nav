# Keys the TUI displays. One entry per key:
#   type, units (docs/config-conventions.md R2), tier, doc, and range [lo, hi] only where a
#   validator enforces exactly that range.
# Nav2 keys are <server>.<plugin>.<key>; MAVROS keys are mavros_setup.<key>; fence keys are
# fence_watchdog.<key> (its section of watchdogs.yaml, tune: applied); lidar keys are lidar.<dotted keys of lidar.yaml>
# (the model and rpm are the vessel profile's).

controller_server.controller_frequency: {type: float, units: Hz, tier: reconfigure, doc: "Controller loop rate; model_dt derives from it."}
controller_server.FollowPath.vx_max: {type: float, units: m/s, tier: live, doc: "Forward speed limit."}
controller_server.FollowPath.vx_min: {type: float, units: m/s, tier: live, doc: "Reverse speed limit."}
controller_server.FollowPath.vy_max: {type: float, units: m/s, tier: live, doc: "Lateral speed limit."}
controller_server.FollowPath.wz_max: {type: float, units: rad/s, tier: live, doc: "Yaw rate limit; also the rotation shim heading rate."}
controller_server.FollowPath.ax_max: {type: float, units: m/s^2, tier: live, doc: "Forward acceleration limit."}
controller_server.FollowPath.ax_min: {type: float, units: m/s^2, tier: live, doc: "Forward deceleration limit."}
controller_server.FollowPath.ay_max: {type: float, units: m/s^2, tier: live, doc: "Lateral acceleration limit."}
controller_server.FollowPath.ay_min: {type: float, units: m/s^2, tier: live, doc: "Lateral deceleration limit."}
controller_server.FollowPath.az_max: {type: float, units: rad/s^2, tier: live, doc: "Yaw acceleration limit; also the rotation shim limit."}
controller_server.FollowPath.time_steps: {type: int, units: count, tier: live, doc: "MPPI rollout horizon steps."}
controller_server.FollowPath.vx_std: {type: float, units: m/s, tier: live, doc: "Forward sampling noise; keep below vx_max."}
controller_server.FollowPath.vy_std: {type: float, units: m/s, tier: live, doc: "Lateral sampling noise; keep below vy_max."}
controller_server.FollowPath.wz_std: {type: float, units: rad/s, tier: live, doc: "Yaw sampling noise; keep below wz_max."}
controller_server.FollowPath.prune_distance: {type: float, units: m, tier: live, doc: "Path length kept ahead of the boat; at least vx_max times the horizon."}
velocity_smoother.max_velocity: {type: list, units: "m/s, m/s, rad/s", tier: live, doc: "Upper velocity limits (x, y, yaw); follow the controller limits."}
velocity_smoother.min_velocity: {type: list, units: "m/s, m/s, rad/s", tier: live, doc: "Lower velocity limits (x, y, yaw)."}
velocity_smoother.max_accel: {type: list, units: "m/s^2, m/s^2, rad/s^2", tier: live, doc: "Acceleration limits (x, y, yaw)."}
velocity_smoother.max_decel: {type: list, units: "m/s^2, m/s^2, rad/s^2", tier: live, doc: "Deceleration limits (x, y, yaw), negative."}

mavros_setup.message_rates: {type: list, units: "ID:Hz", tier: live, doc: "MAVLink message intervals requested on connect and reconnect; 0 resets, -1 disables."}
mavros_setup.retry_attempts: {type: int, units: count, tier: restart, doc: "Interval requests attempted per connection."}
mavros_setup.retry_delay: {type: float, units: s, tier: restart, doc: "Wait between request attempts."}
mavros_setup.response_timeout: {type: float, units: s, tier: restart, doc: "Wait for each request response."}
mavros_setup.service_wait: {type: float, units: s, tier: restart, doc: "Wait for the MAVROS interval service."}
mavros_setup.reboot_dedupe_window: {type: float, units: s, tier: restart, doc: "Window that merges repeated FCU reboot observations."}
mavros_setup.verify_period: {type: float, units: s, tier: restart, doc: "Span over which FCU message rates are counted; ids below 0.7 of their request are requested again."}
mavros_setup.rc_window: {type: float, units: s, tier: restart, doc: "RC rate measurement window; diagnostic only."}
mavros_setup.rc_min_hz: {type: float, units: Hz, tier: restart, doc: "RC rate below which a diagnostic is logged."}
mavros_setup.rc_min_channels: {type: int, units: count, tier: restart, doc: "Minimum RC channels expected."}
mavros_setup.rc_grace: {type: float, units: s, tier: restart, doc: "Startup grace before RC diagnostics."}
mavros_setup.rc_timer: {type: float, units: s, tier: restart, doc: "RC diagnostic check period."}
mavros_setup.fcu_sysid: {type: int, units: "1", range: [1, 255], tier: restart, doc: "MAVLink system ID whose observations are accepted."}

lidar.tune.smear: {type: bool, units: bool, tier: restart, doc: "Sim only: smear the simulator's instantaneous scan over a VLP16 sweep, as a turning boat sees it."}
lidar.costmap.sectors: {type: int, units: count, tier: restart, doc: "Sectors of /perception/nearby, from the bow clockwise."}
lidar.costmap.rate: {type: float, units: Hz, tier: restart, doc: "Most /perception/nearby summaries per second; none without a new cloud."}
lidar.driver.frame: {type: str, units: frame, tier: restart, doc: "Lidar TF frame; the full robot requires lidar_link."}
lidar.driver.endpoint.ip: {type: str, units: "1", tier: restart, doc: "Device IPv4 address; the vessel profile's unless a layer or velodyne_ip sets it."}
lidar.driver.endpoint.port: {type: int, units: "1", range: [1, 65535], tier: restart, doc: "Device UDP port."}

fence_watchdog.course.corners: {type: list, units: deg, tier: live, doc: "Course area [lat1, lon1, ...]: at least 3 corners of a simple polygon; replaces the fence whole or is refused with the reason."}
fence_watchdog.margin: {type: float, units: m, tier: restart, doc: "Edge band where heading or moving outward already holds; covers the coast after a hold."}
fence_watchdog.on_exit: {type: str, units: enum, tier: live, doc: "Outside under autonomy: alert holds; return pauses the runners, sends one slow Nav2 goal back inside, then holds until the operator or an agent releases it."}
fence_watchdog.return_inset: {type: float, units: m, tier: restart, doc: "How far inside the nearest edge the return goal lies."}
fence_watchdog.return_speed: {type: float, units: m/s, tier: restart, doc: "Nav2 speed limit while returning; lifted when the return ends."}
fence_watchdog.return_timeout: {type: float, units: s, tier: restart, doc: "Time to get back inside before the return holds as alert does."}
fence_watchdog.return_lead: {type: float, units: s, tier: restart, doc: "Wait between the pause request and the return goal, for the runners to cancel their goals."}
fence_watchdog.return_tries: {type: int, units: count, tier: restart, doc: "Return goal sends while Nav2 refuses it before the return fails."}
fence_watchdog.status_rate: {type: float, units: Hz, tier: restart, doc: "Rate of the /fence/status JSON; it also publishes on every change."}
