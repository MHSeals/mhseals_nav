rtabmap:
  ros__parameters:
    # Sensors
    subscribe_depth: false # Should be enabled when using actual zed
    subscribe_rgb: true
    subscribe_rgbd: false
    subscribe_stereo: false
    subscribe_scan: true
    
    # Frames
    frame_id: "base_link"
    map_frame_id: "map"
    odom_frame_id: "odom"
    
    # Odometry
    odom_sensor_sync: false
    wait_for_transform: 0.3
    approx_sync: true
    publish_tf: false

    sync_queue_size: 10
    topic_queue_size: 10

    # 2D map parameters
    Grid/2D_map: "true"
    Grid/Sensor: "false"
    Grid/FromDepth: "false"
    Grid/MaxGroundHeight: "0.5"
    Grid/MinGroundHeight: "-0.5"
    Grid/MaxObstacleHeight: "2.0"
    Grid/CellSize: "0.05"
    Grid/PreVoxelFiltering: "false"
    Grid/3D: "false"
    Mem/SaveDepth16Format: "true"
    Mem/DepthCompressionFormat: ".rvl"