rtabmap:
  ros__parameters:
    # Sensors
    # The boat's always-on sensor is the VLP16 PointCloud2 stream.  Camera
    # topics live on the Jetson's separate ROS domain and are optional; if
    # RGB/depth remain enabled RTAB-Map synchronizes all inputs and silently
    # waits forever when the camera is not running.
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_rgbd: false
    subscribe_stereo: false
    subscribe_scan: false
    subscribe_scan_cloud: true
    
    # Frames
    frame_id: "base_link"
    map_frame_id: "map"
    odom_frame_id: "odom"
    
    # Odometry
    odom_sensor_sync: false
    wait_for_transform: 0.3
    approx_sync: true
    publish_tf: false

    sync_queue_size: 10
    topic_queue_size: 10

    # 2D map parameters
    Grid/2D_map: "true"
    Grid/Sensor: "false"
    Grid/FromDepth: "false"
    Grid/MaxGroundHeight: "0.6"
    Grid/MinGroundHeight: "-0.6"
    Grid/MaxObstacleHeight: "1.2"
    Grid/RangeMin: "0.7"
    Grid/RangeMax: "15.0"
    Grid/ClusterRadius: "0.1"
    Grid/MinClusterSize: "5"
    Grid/CellSize: "0.05"
    Grid/RayTracing: "true"
    Grid/PreVoxelFiltering: "true"
    Grid/3D: "false"
    Grid/NoiseFilteringRadius: "0.2"
    Grid/NoiseFilteringMinNeighbors: "3"
    Mem/SaveDepth16Format: "true"
    Mem/DepthCompressionFormat: ".rvl"

    # RTAB-Map's scan-cloud input is remapped to /points by slam.launch.py.
    # Keep this explicit so a future /scan LaserScan publisher cannot make
    # the mapper switch inputs accidentally.
    subscribe_sensor_data: false

rgbd_odometry:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    publish_tf: false
    publish_null_when_lost: false
    guess_frame_id: ""
    wait_for_transform: 0.3
    
    # Visual odometry parameters
    Odom/Strategy: "0"  # Frame-to-Map = 0, Frame-to-Frame = 1
    Odom/ResetCountdown: "1"
    Odom/MaxRotation: "0.1"
    Odom/MaxTranslation: "0.2"
    Odom/ResetCountdown: "0"
    Odom/MinInliers: "15"  # Lower from default 20 if features are sparse
    OdomF2M/MaxSize: "2000"
    Vis/MinInliers: "15"
    Vis/InlierDistance: "0.1"
    Vis/MaxDepth: "10.0"
    Vis/CorNNDR: "0.8"
