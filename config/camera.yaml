# The front camera, a ZED 2i: its preview stream (camera.launch.py) and the ZED object backend
# (objects.launch.py backend:=zed). The wrapper's own settings are its ROS parameter files,
# zed_boat.yaml and custom_object_detection.yaml.
tune:
  preview_rate: 2.0     # the TUI's compressed preview; ZED capture and publication are separate

# zed_backend: ZED wrapper objects -> /perception/observations.
backend:
  backend: zed_native                   # stage name under /perception/status
  objects_topic: /front/zed_node/obj_det/objects
  camera_info_topic: /front/zed_node/rgb/color/rect/camera_info
  box2d_scale: 2.0                      # 2D boxes are in grab pixels; = zed_boat pub_downscale_factor
  max_detection_age: 1.0                # older frames are dropped
  velocity_kind: none                   # none | relative | world, set by the bench turn test
  fov:
    hfov: 1.919862                      # 110 degrees
    range: 20.0                         # = zed_boat object_detection.max_range
