# object_tracker: world-frame CV Kalman tracker (perception-v2 §5). Loaded from the
# installed share as defaults; launch parameters override single keys.
/**:
  ros__parameters:
    tracking_frame: odom
    map_frame: map
    base_frame: base_link
    observations_topic: /perception/observations
    rate_hz: 10.0
    markers_hz: 2.0
    status_hz: 1.0
    max_detection_age: 1.0
    # Mahalanobis gates: chi2 2-dof 0.99 / 0.999, 4-dof 0.99.
    gate_chi2: 9.21
    gate_chi2_id: 13.8
    gate_chi2_v: 13.3
    group_match: false
    # exclusion_chi2: a leftover inside this looser gate of a track starts no candidate.
    candidate: {hits: 3, time: 0.5, timeout: 1.0, exclusion_chi2: 30.0}
    meas:
      min_sigma_m: 0.10
      range_frac: 0.03
      # Tangential term: static buoys stay static through the §8 envelope (bias 5 deg plus
      # extrinsic 3 deg, lag plus stamp offset 0.2 s) in the metamorphic suite.
      heading_sigma_deg: 3.0
      lag_sigma_s: 0.25
      # A lag fakes velocity rho*lag*|dr/dt|, largest while the yaw rate reverses through
      # zero, where |r| is near zero. So the lag term uses the largest |r| of this window,
      # and the speed bound adds rho*lag_sigma_s*|dr/dt| (largest of the window, so it
      # lasts as long as the filter remembers the faked velocity).
      lag_window_s: 3.0
      yaw_accel_dt: 0.5          # dr/dt is the yaw rate's slope over this span
      cam_vel_dt: 0.05
    use_backend_velocity: false
    velocity_sigma: 0.5          # m/s, when the backend gives no velocity covariance
    score_alpha: 0.3
    size_alpha: 0.3
    # Classes match the first group whose patterns fit (fnmatch); others are `unknown`.
    # move_s / static_s: seconds of consecutive moving / static evidence before a flip
    # (the spec's update counts at 15 Hz), so the hysteresis does not depend on the rate.
    # move_chi2: a STATIC track whose estimate leaves its slow heading anchor by more than
    # this (position noise, tangential term included) has moving evidence, so a boat that
    # paused and then crosses below the speed bound still turns MOVING. Not for buoys:
    # heading errors inside the §8 envelope displace a moored buoy by metres at range.
    class_groups:
      buoy: {match: ['*_buoy', black_cross, black_triangle], prior: static,
             q: 0.005, sigma_v0: 0.3, move_s: 0.8, static_s: 0.27}
      # Spec q 0.5 gives a steady speed sigma near 0.45 m/s, so k_sigma=3 could never
      # call a 0.8 m/s boat moving; 0.05 keeps the bound near 0.8 m/s at 10 m.
      boat: {match: ['*_target_boat'], prior: moving,
             q: 0.05, sigma_v0: 1.5, move_s: 0.2, static_s: 1.33,
             move_chi2: 13.8}
      unknown: {match: ['?'], prior: unknown,
                q: 0.1, sigma_v0: 1.0, move_s: 0.4, static_s: 0.53,
                move_chi2: 13.8}
    # static_bound_max_mps: no static evidence while the bound is wider (young tracks).
    # max_step_s: one update adds at most this much evidence time (gaps do not count).
    motion: {k_sigma: 3.0, floor_mps: 0.25, release_frac: 0.5, n_unknown_min: 5,
             static_bound_max_mps: 1.2, max_step_s: 0.2}
    tau: {static: 300.0, moving: 2.0, unknown: 5.0}
    timeout: {static: 900.0, moving: 3.0, unknown: 10.0}
    miss_in_fov_s: 5.0
    fov: {hfov_deg: 110.0, range_m: 20.0}   # mirrors the backend YAML
    # Disc radius per class (m), copied from mhseals_testing/config/minimap.yaml.
    radius:
      default: 0.20
      red_pole_buoy: 0.25
      red_buoy: 0.20
      red_light_buoy: 0.25
      green_pole_buoy: 0.25
      green_buoy: 0.20
      green_light_buoy: 0.25
      yellow_buoy: 0.20
      black_buoy: 0.20
      blue_buoy: 0.30
      yellow_target_boat: 0.60
      black_target_boat: 0.60
      black_triangle: 0.30
      black_cross: 0.30
    grid:
      topic: /perception/track_grid
      size_m: 24.0
      resolution: 0.15
      rate_hz: 5.0
      max_extra_m: 0.5
      horizon_s: 3.0
      step_s: 0.25
      gamma: 1.0
      min_cost: 40
    heading_check:
      window_s: 60.0
      min_hits: 10
      anchor_tau_s: 40.0         # residuals vs a slow static anchor, not the CV prior
      yaw_dt: 0.1
      min_samples: 60
      min_tracks: 2
      min_samples_track: 10
      min_yaw_rate_std: 0.08
      rho_warn: 0.5
      agree_min: 0.75
      lag_warn_s: 0.05
      lag_error_s: 0.15
    course_map:
      name: boat
      # Under use_sim_time each run writes its own <sim_dir>/<UTC start>_<pid>.json and so
      # never loads priors: concurrent or successive sims never share a course map.
      sim_dir: sim
      load: true
      save_period_s: 10.0
      save_min_hits: 20
      save_groups: [buoy]        # class groups saved; boats and unknowns never are
      prior_confidence: 0.5
      prior_sigma_m: 0.5
      max_age_days: 3.0
      to_ll_service: /toLL       # navsat_transform on B (root namespace)
      from_ll_service: /fromLL
      datum_topic: /odom/gps     # navsat's odometry/gps: published only once its datum is set
