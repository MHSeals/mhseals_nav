name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # The smoke tier (./smoke.sh): config parse and the pure-python units, no ROS.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest PyYAML numpy
      - run: ./smoke.sh
